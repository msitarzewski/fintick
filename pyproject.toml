[project]
name = "fintick"
version = "0.1.0"
description = "An accountable financial event-intelligence pipeline powered by Bluesky"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Sitarzewski" }]

[project.scripts]
fintick = "fintick.cli:main"
fintick-benchmark = "fintick.benchmark:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintick*"]
